<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Founding Charter attestation verifier</title>
<style>
  :root { color-scheme: light dark; --fg: #111; --bg: #fbfbfa; --muted: #6b7280; --line: #d9d9d6; --ok: #0f7a3d; --bad: #b42318; --accent: #2f5fe0; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8e8e6; --bg: #131315; --muted: #9aa0aa; --line: #2c2c31; --ok: #46c98b; --bad: #ff7b72; --accent: #7aa2ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem 1.25rem 4rem; background: var(--bg); color: var(--fg); font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  p.lede { margin: 0 0 1.75rem; color: var(--muted); }
  form { display: grid; gap: .9rem; border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem; }
  label { display: grid; gap: .3rem; font-size: .85rem; color: var(--muted); }
  input, select { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: .55rem .65rem; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; gap: .9rem; grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: .65rem 1rem; cursor: pointer; justify-self: start; }
  button[disabled] { opacity: .55; cursor: progress; }
  #out { margin-top: 1.5rem; display: grid; gap: 1rem; }
  .verdict { display: flex; align-items: center; gap: .6rem; font-weight: 650; font-size: 1.05rem; }
  .dot { width: .65rem; height: .65rem; border-radius: 50%; background: var(--muted); }
  .ok .dot { background: var(--ok); } .bad .dot { background: var(--bad); }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: .5rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  code { font:.8rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1rem; margin: 0; font-size: .86rem; }
  dt { color: var(--muted); } dd { margin: 0; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Founding Charter attestation verifier</h1>
  <p class="lede">Reads an EAS attestation on Base, fetches every charter text from IPFS, recomputes its sha256 and shows match or mismatch per text.</p>

  <form id="f">
    <label>Attestation UID (bytes32)
      <input id="uid" name="uid" placeholder="0x…" spellcheck="false" autocomplete="off" required />
    </label>
    <div class="row">
      <label>Network
        <select id="network">
          <option value="base">Base (8453)</option>
          <option value="base-sepolia">Base Sepolia (84532)</option>
        </select>
      </label>
      <label>IPFS gateway
        <input id="gateway" value="https://ipfs.io/ipfs/" spellcheck="false" />
      </label>
    </div>
    <button id="go" type="submit">Verify</button>
  </form>

  <div id="out" aria-live="polite"></div>
</main>

<script type="module">
import { verifyCharter, jsonRpc, ipfsGateway, PUBLIC_RPC, EAS_ADDRESS } from './verifier.js';

const $ = (id) => document.getElementById(id);
const out = $('out');
const go = $('go');

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else n.setAttribute(k, v);
  }
  for (const k of kids) n.append(k);
  return n;
}

function render(r, network) {
  out.replaceChildren();
  const good = r.ok === true;
  out.append(el('div', { class: `verdict ${good ? 'ok' : 'bad'}` },
    el('span', { class: 'dot' }), el('span', { text: good ? 'Valid — every text matches the attestation' : `Not valid — ${r.reason || 'verification failed'}` })));

  if (r.attestation) {
    const a = r.attestation;
    const dl = el('dl');
    const rows = [
      ['uid', a.uid], ['attester', a.attester], ['network', `${network} · EAS ${EAS_ADDRESS}`],
      ['time', new Date(a.time * 1000).toISOString()], ['revoked', String(a.revoked)],
    ];
    for (const [k, v] of rows) { dl.append(el('dt', { text: k }), el('dd', {}, el('code', { text: String(v) }))); }
    out.append(dl);
  }

  if (r.texts && r.texts.length) {
    const t = el('table');
    t.append(el('thead', {}, el('tr', {},
      el('th', { text: 'text' }), el('th', { text: 'cid' }), el('th', { text: 'sha256' }), el('th', { text: 'result' }))));
    const body = el('tbody');
    for (const x of r.texts) {
      body.append(el('tr', {},
        el('td', { text: x.name }),
        el('td', {}, el('code', { text: x.cid })),
        el('td', {}, el('code', { text: x.expected }), el('br'), el('code', { class: x.match ? '' : 'err', text: x.actual || '—' })),
        el('td', { class: x.match ? 'ok' : 'bad', text: x.match ? 'match' : 'MISMATCH' }),
      ));
      if (x.error) body.append(el('tr', {}, el('td', { colspan: '4', class: 'err', text: x.error })));
    }
    t.append(body);
    out.append(t);
  }
}

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const uid = $('uid').value.trim();
  const network = $('network').value;
  const gateway = $('gateway').value.trim() || 'https://ipfs.io/ipfs/';
  out.replaceChildren(el('p', { text: 'Reading attestation and hashing texts…' }));
  go.disabled = true;
  try {
    const r = await verifyCharter({ uid, network, rpc: jsonRpc(PUBLIC_RPC[network]), ipfs: ipfsGateway(gateway) });
    render(r, network);
    const url = new URL(location.href);
    url.searchParams.set('uid', uid);
    url.searchParams.set('network', network);
    history.replaceState(null, '', url);
  } catch (err) {
    out.replaceChildren(el('div', { class: 'verdict bad' }, el('span', { class: 'dot' }), el('span', { text: `Error: ${err.message}` })));
  } finally {
    go.disabled = false;
  }
});

const q = new URLSearchParams(location.search);
if (q.get('uid')) { $('uid').value = q.get('uid'); if (q.get('network')) $('network').value = q.get('network'); $('f').requestSubmit(); }
</script>
</body>
</html>
